name: LASER WEAVE balance regression

on:
  push:
    branches:
      - 'balance/laser-weave-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check game.js
          node --check laserWeave.js
          node --check gameplayTiming.js
      - name: Functional regressions without shared-host performance gate
        run: node --test --test-concurrency=1 --test-name-pattern='^(?!45-body ten-second simulation stays bounded, finite, and performant$)' *.test.mjs
      - name: Physics p95 performance (informational on shared runner)
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern='^45-body ten-second simulation stays bounded, finite, and performant$' tsumPhysics.test.mjs
